seed: 42
image_size: [256, 256]

profiles:
  smoke:
    per_class: {train: 140, validation: 20, test: 40}
    stream_budget_mib: 1024
    max_batches_per_shard: 3
  experiment:
    per_class: {train: 1400, validation: 200, test: 400}
    stream_budget_mib: 5120
    max_batches_per_shard: 12

output_dir: data/prepared
summary_path: resultados/resumo_dataset.json
cifake:
  dataset: CIFAKE
  generator: Stable Diffusion 1.4
  category: automobile
  image_size: [32, 32]
  classes: {REAL: 0, FAKE: 1}
  per_class: {train: 105, validation: 15, test: 30}
  seed: 42
  contact_candidates: {train: 1500, test: 500}
  frequency_range: [0.25, 0.50]
  radial_bins: 16
  energy_bands: [0.25, 0.3125, 0.375, 0.50]
  classifiers: [random_forest_spatial, random_forest_spectral, random_forest_hybrid]
  transformations:
    jpeg_quality: [75, 30]
    resize: [24, 16]
    gaussian_sigma: [0.5, 1.0]
random_forest:
  n_estimators: 300
  max_depth: 6
  min_samples_split: 4
  min_samples_leaf: 2
  max_features: 1.0
  criterion: gini
  bootstrap: true
  random_state: 42
  n_jobs: -1
